name: Publish SDK documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "go/docs/**"
      - "typescript/docs/**"
      - "typescript/mkdocs.yml"
      - "python/docs/**"
      - "python/mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: python -m pip install "mkdocs-material>=9.7,<10"
      - name: Build TypeScript documentation
        working-directory: typescript
        run: mkdocs build --strict --site-dir ../_site/typescript
      - name: Build Python documentation
        working-directory: python
        run: mkdocs build --strict --site-dir ../_site/python
      - name: Add repository landing page
        run: cp docs/index.html _site/index.html
      - name: Build Go documentation
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./go/docs
          destination: ./_site/go
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
