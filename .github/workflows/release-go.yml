name: Release Go modules

on:
  push:
    tags:
      - "protocol/v*"
      - "go/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Select tagged module
        id: module
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            protocol/v*) echo "directory=protocol" >> "$GITHUB_OUTPUT" ;;
            go/v*) echo "directory=go" >> "$GITHUB_OUTPUT" ;;
            *) echo "unsupported module tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
      - name: Test standalone module
        working-directory: ${{ steps.module.outputs.directory }}
        env:
          GOWORK: "off"
        run: go test ./...
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
